# --- servingz / Mosca: per-bucket S3A settings for the shared MinIO bucket `mosca` only.
# Lightning's S3A client addresses the bucket virtual-host style (mosca.minio:9000); that name is the lab-mosca-s3-alias
# forwarder in the lab-mosca-pg Coolify service, which passes the Host header through to MinIO (MINIO_DOMAIN=minio).
spark.hadoop.fs.s3a.bucket.mosca.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.bucket.mosca.path.style.access        true
spark.hadoop.fs.s3a.bucket.mosca.connection.ssl.enabled   false
spark.hadoop.fs.s3a.bucket.mosca.endpoint.region          us-east-1
spark.hadoop.fs.s3a.bucket.mosca.attempts.maximum         3
spark.hadoop.fs.s3a.bucket.mosca.retry.limit              3
