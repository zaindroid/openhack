# Deterministic checks on the illustrative seed. Run: python -m whycore.evals app/evals.yaml
cases:
  - id: andes_no_recordings_no_project
    signal_contains: "Language A (Andes)"
    expect_supported: [no_recordings, no_active_project]
    expect_rejected: [unreachable_speakers, no_orthography, resources_unarchived]
    first_action_contains: "audio documentation"
  - id: new_guinea_unreachable
    signal_contains: "Language B (Highland New Guinea)"
    expect_supported: [unreachable_speakers]
    expect_rejected: [no_recordings, no_orthography, resources_unarchived, no_active_project]
    first_action_contains: "access"
  - id: sahel_unarchived
    signal_contains: "Language C (Sahel)"
    expect_supported: [resources_unarchived]
    expect_rejected: [no_recordings, unreachable_speakers, no_orthography, no_active_project]
    first_action_contains: "archive"
  - id: warm_run
    warm: true
