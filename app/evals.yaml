# Deterministic checks on the illustrative catalogue. Signal labels are "A × B: miss at TCA".
cases:
  - id: phasing_pass_same_operator
    signal_contains: "MESHSAT-A-07 × MESHSAT-A-08"
    expect_supported: [constellation_phasing]
    expect_rejected: [fragmentation, uncontrolled_drift, natural_crossing]
    first_action_contains: "MeshSat"
  - id: fragment_crosses_imaging_sat
    signal_contains: "EARTHVIEW-3 × DEB-2023-FRAG-07"
    expect_supported: [fragmentation]
    expect_rejected: [uncontrolled_drift, constellation_phasing, natural_crossing]
    first_action_contains: "EARTHVIEW-3"
  - id: decaying_rocket_body
    signal_contains: "EARTHVIEW-5 × RB-2019-044B"
    expect_supported: [uncontrolled_drift]
    expect_rejected: [fragmentation, constellation_phasing, natural_crossing]
    first_action_contains: "EARTHVIEW-5"
  - id: plane_crossing_two_payloads
    signal_contains: "MESHSAT-A-15 × POLARCAM-2"
    expect_supported: [natural_crossing]
    expect_rejected: [fragmentation, uncontrolled_drift, constellation_phasing]
    first_action_contains: "POLARCAM-2"
  - id: warm_run
    warm: true
