<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosca Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root { --bg:#0b0f17; --panel:rgba(16,21,31,.94); --line:#232a37; --line2:#1b212c; --text:#e4e8ef; --muted:#9099a8; --faint:#646d7c;
          --late:#e5484d; --risk:#d99a2b; --retire:#7c8494; --safe:#3fa37f; --agent:#8b7cf6; --infra:#5b7fbf; --core:#5fb3c7; --accent:#3e7bfa; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font:13px/1.45 Inter, system-ui, sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; }
  #gl { position:fixed; inset:0; display:block; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .mono { font-family:"IBM Plex Mono", monospace; }
  .hud { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:9px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
          box-shadow:0 10px 30px var(--shadow), inset 0 1px 0 color-mix(in srgb, var(--core) var(--edgeglow), transparent); }
  /* a thin lit edge along the top of each panel: the one place the HUD itself glows */
  .hud::before { content:""; position:absolute; left:14px; right:14px; top:-1px; height:1px; pointer-events:none;
                 background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--core) var(--edgeglow2), transparent), transparent); }
  .themes { display:flex; gap:5px; align-items:center; padding:0 4px; }
  .themes button { width:16px; height:16px; border-radius:50%; border:1px solid var(--line); cursor:pointer; padding:0; background:linear-gradient(135deg, var(--b) 50%, var(--a) 50%); }
  .themes button.on { outline:2px solid var(--accent); outline-offset:2px; }
  .k { font:600 10.5px "IBM Plex Mono", monospace; letter-spacing:1.6px; text-transform:uppercase; color:var(--muted); }

  header { left:16px; right:16px; top:14px; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; padding:10px 14px; }
  header h1 { margin:0; font:600 14px Inter, sans-serif; letter-spacing:.5px; }
  header h1 span { color:var(--core); }
  header .q { color:var(--muted); flex:1; min-width:180px; font-size:12.5px; }
  .pill { font:500 11px "IBM Plex Mono", monospace; padding:3px 9px; border:1px solid var(--line); border-radius:5px; color:var(--muted); white-space:nowrap; }
  .pill::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--faint); margin-right:6px; vertical-align:1px; }
  .pill.on::before { background:var(--safe); } .pill.busy::before { background:var(--risk); animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  .btn { background:var(--accent); color:#fff; border:0; border-radius:7px; padding:7px 13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn:disabled { opacity:.5; cursor:default; }
  .ghost { background:transparent; border:1px solid var(--line); border-radius:7px; padding:6px 11px; cursor:pointer; color:var(--text); text-decoration:none; white-space:nowrap; font-size:12.5px; }
  .ghost:hover { border-color:var(--accent); }

  /* left: status + legend */
  #left { left:16px; top:86px; width:250px; padding:12px; max-height:calc(100vh - 110px); overflow-y:auto; overflow-x:hidden; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0 14px; }
  .stat { text-align:left; background:var(--soft); border:1px solid var(--line2); border-radius:8px; padding:8px 10px; cursor:pointer; }
  .stat b { display:block; font:600 22px Inter, sans-serif; color:var(--c); font-variant-numeric:tabular-nums; text-shadow:0 0 var(--tglow) color-mix(in srgb, var(--c) 45%, transparent); }
  .stat span { font-size:11px; color:var(--muted); }
  .stat.sel { border-color:var(--c); }
  .legend { display:grid; gap:7px; margin-top:8px; }
  .lg { display:flex; align-items:center; gap:9px; font-size:12px; color:var(--muted); }
  .lg svg { width:22px; height:22px; flex:none; }
  .lg b { color:var(--text); font-weight:500; }
  .rule { margin-top:12px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line2); padding-top:10px; }
  .rule code { color:var(--core); font-family:"IBM Plex Mono", monospace; }

  /* right: decision queue */
  #right { right:16px; top:86px; width:330px; max-height:calc(100vh - 110px); display:flex; flex-direction:column; }
  #right .hd { padding:12px 14px 8px; display:flex; align-items:center; gap:8px; }
  #right .hd b { font:600 13px "IBM Plex Mono", monospace; color:var(--risk); }
  #queue { overflow-y:auto; overflow-x:hidden; padding:0 10px 10px; display:grid; gap:8px; }
  .card { border:1px solid var(--line2); border-left:2px solid var(--c); border-radius:8px; padding:9px 10px; background:var(--soft); transition:border-color .2s, transform .2s, opacity .3s; }
  .card:hover, .card.hl { border-color:var(--c); transform:translateX(-2px); }
  .card .t { display:flex; gap:8px; align-items:center; }
  .card .n { font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .card .n:hover { color:var(--core); }
  .chip { font:600 9.5px "IBM Plex Mono", monospace; letter-spacing:1px; padding:1px 6px; border-radius:3px; color:var(--c); border:1px solid color-mix(in srgb, var(--c) 50%, transparent); white-space:nowrap; }
  .card .a { font-size:12px; color:var(--muted); margin:5px 0 7px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .row { display:flex; gap:6px; }
  .ok, .no { border-radius:6px; padding:4px 10px; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:transparent; }
  .ok { background:var(--accent); border-color:var(--accent); color:#fff; }
  .ok:disabled, .no:disabled { opacity:.45; cursor:default; }
  .card.gone { opacity:0; transform:translateX(30px); }
  .late { --c:var(--late); } .risk { --c:var(--risk); } .retire { --c:var(--retire); } .safe { --c:var(--safe); }

  /* labels in 3D space */
  .tag { position:absolute; transform:translate(-50%, -100%); white-space:nowrap; font:600 10px "IBM Plex Mono", monospace; letter-spacing:1.2px; pointer-events:none; }
  .tag.agent { color:var(--agent); padding:2px 8px; border:1px solid color-mix(in srgb, var(--agent) 50%, transparent); border-radius:20px; background:var(--tagbg); box-shadow:0 0 var(--tglow) color-mix(in srgb, var(--agent) 30%, transparent); }
  .tag.agent::before { content:"◆ "; }
  .tag.infra { color:var(--tagtext); padding:2px 7px; border:1px solid var(--tagline); border-radius:3px; background:var(--tagbg); }
  .tag.lane { color:var(--faint); letter-spacing:2px; }
  .tag.att { pointer-events:auto; cursor:pointer; color:var(--c); padding:1px 6px; border:1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius:3px; background:var(--tagbg); }
  .tag.att:hover { background:var(--c); color:var(--bg); }
  .tag[hidden] { display:none; }
  #tip { position:fixed; pointer-events:none; display:none; z-index:5; padding:8px 10px; font-size:12px; max-width:280px; }
  #tip b { display:block; }

  .progress { position:fixed; left:0; right:0; top:0; height:2px; z-index:6; }
  .progress div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  #feed { left:282px; right:362px; bottom:14px; padding:8px 12px; font:11.5px/1.5 "IBM Plex Mono", monospace; color:var(--muted); height:74px; overflow:hidden; }
  #feed div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #feed .ag { color:var(--agent); } #feed .in { color:var(--infra); }
  .help { position:fixed; left:282px; top:86px; color:var(--faint); font-size:11.5px; pointer-events:none; }

  /* drawer */
  aside { position:fixed; top:0; right:0; bottom:0; width:min(520px, 100vw); background:var(--drawer); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .25s ease; z-index:20; overflow:auto; }
  aside.on { transform:none; }
  aside .dh { position:sticky; top:0; background:var(--drawer); padding:14px 18px 10px; border-bottom:1px solid var(--line2); display:flex; gap:10px; align-items:flex-start; }
  aside .dh h2 { margin:2px 0 0; font-size:15px; font-weight:600; word-break:break-word; }
  aside .dh .x { margin-left:auto; }
  aside section { padding:12px 18px; border-bottom:1px solid var(--line2); }
  aside h5 { margin:0 0 8px; font:600 10.5px "IBM Plex Mono", monospace; letter-spacing:1.4px; color:var(--muted); text-transform:uppercase; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:12.5px; } .kv dt { color:var(--muted); } .kv dd { margin:0; font:12px "IBM Plex Mono", monospace; word-break:break-all; }
  .v { padding:7px 0; border-top:1px solid var(--line2); } .v:first-of-type { border-top:0; }
  .v .t { display:flex; gap:8px; align-items:center; font-size:12.5px; font-weight:500; } .v .r { font-size:12px; color:var(--muted); margin-top:2px; }
  .vchip { font:600 9.5px "IBM Plex Mono", monospace; padding:1px 6px; border-radius:3px; text-transform:uppercase; flex:none; }
  .vchip.retire { color:var(--retire); border:1px solid var(--retire); }
  .vchip.support { color:var(--late); border:1px solid var(--late); } .vchip.reject { color:var(--safe); border:1px solid var(--safe); } .vchip.uncertain { color:var(--risk); border:1px solid var(--risk); }
  summary { cursor:pointer; font-size:11.5px; color:var(--accent); }
  pre { font:11px/1.5 "IBM Plex Mono", monospace; background:var(--soft); border:1px solid var(--line2); border-radius:6px; padding:8px; white-space:pre-wrap; word-break:break-word; margin:6px 0 0; color:var(--muted); }
  .ex { font-size:12.5px; white-space:pre-wrap; }
  .ax { display:flex; gap:8px; align-items:flex-start; padding:7px 0; border-top:1px solid var(--line2); } .ax:first-of-type { border-top:0; }
  .ax .l { flex:1; font-size:12.5px; } .ax .l small { display:block; color:var(--muted); font-size:11.5px; } .ax .s { font-size:11.5px; color:var(--muted); }
  .mosca svg { width:100%; height:auto; display:block; } .mosca text { font:10.5px "IBM Plex Mono", monospace; fill:var(--muted); }
  .mosca .seg { transition:width .8s cubic-bezier(.2,.8,.2,1); }
  .toasts { position:fixed; left:50%; transform:translateX(-50%); bottom:100px; display:flex; flex-direction:column; gap:8px; z-index:30; align-items:center; }
  .toast { padding:9px 14px; font-size:12.5px; max-width:460px; animation:tin .25s ease-out; background:var(--drawer); border:1px solid var(--line); border-radius:8px; }
  @keyframes tin { from { opacity:0; transform:translateY(8px); } }
  #nogl { position:fixed; inset:0; display:none; place-items:center; text-align:center; color:var(--muted); }
  @media (max-width:1100px) { #left { display:none; } #feed { left:16px; } .help { left:16px; } }
  @media (max-width:760px) { #right { top:auto; bottom:14px; left:16px; right:16px; width:auto; max-height:40vh; } #feed { display:none; } header .q { display:none; } }
  #left { width:190px; }
  .stats { margin:0 0 12px; }
  .legend { gap:6px; margin:0; }
  .lg { font-size:12px; color:var(--text); }
  .lg i { font-style:normal; width:16px; text-align:center; color:var(--c); }
  .rule { margin-top:10px; padding-top:8px; }
  .rule.links { margin-top:6px; border:0; padding-top:0; } .rule a { color:var(--muted); } .rule a:hover { color:var(--core); }
  #right { width:290px; }
  .card .a { -webkit-line-clamp:1; margin:4px 0 6px; }
  #feed { height:44px; font-size:11px; }
  .tag.infra small { font-size:8px; opacity:.6; margin-right:5px; letter-spacing:1.5px; }
  .tag.gw { color:var(--core); border-color:color-mix(in srgb, var(--core) 40%, transparent); }
  .tag.you { color:var(--safe); border-color:color-mix(in srgb, var(--safe) 40%, transparent); }
  /* drawer: one sentence, one timeline, one decision; evidence on request */
  aside { width:min(400px, 100vw); }
  aside .dh { align-items:center; }
  aside .dh .nm { font-size:15px; font-weight:600; } aside .dh .sb { font:11px "IBM Plex Mono", monospace; color:var(--muted); }
  aside .x { margin-left:auto; border:0; background:none; font-size:20px; color:var(--muted); cursor:pointer; line-height:1; }
  .say { font-size:17px; font-weight:500; line-height:1.35; color:var(--c); padding:16px 18px 6px; }
  .rec { border:1px solid var(--line); border-radius:9px; padding:12px; background:var(--soft); }
  .rec .l { font-size:13.5px; margin:4px 0 10px; }
  .rec .row button { padding:7px 16px; font-size:12.5px; }
  .more { font-size:12px; color:var(--muted); margin-top:8px; }
  .more summary, .ev summary { color:var(--muted); font-size:12px; list-style:none; }
  .more summary:hover, .ev summary:hover { color:var(--core); }
  .ev { padding:12px 18px 18px; }
  .ev .v { display:block; }
  .ev .v summary { display:flex; gap:8px; align-items:center; color:var(--text); font-size:12.5px; padding:4px 0; }
  .ev .v .r { margin:2px 0 6px 0; }
  .ev .meta { font:11px "IBM Plex Mono", monospace; color:var(--faint); margin-top:10px; word-break:break-all; }
  .fresh { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .fresh input { accent-color:var(--accent); }
  #speed { margin:0 0 12px; padding:8px 10px; border:1px solid var(--line2); border-radius:8px; background:var(--soft); font:11.5px/1.5 "IBM Plex Mono", monospace; color:var(--muted); }
  #speed:empty { display:none; } #speed b { color:var(--text); font-weight:600; } #speed .t { font:600 18px Inter, sans-serif; color:var(--core); }
  .pr .vchip { min-width:44px; text-align:center; }
  .ev h6 { margin:12px 0 4px; font:600 10px "IBM Plex Mono", monospace; letter-spacing:1.3px; color:var(--muted); text-transform:uppercase; }
</style>

<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div class="progress"><div id="prog"></div></div>

<header class="hud">
  <h1>Mosca <span style="color:var(--muted);font-weight:500">vault</span></h1>
  <span style="flex:1"></span>
  <div class="themes" id="themes" role="group" aria-label="Theme"></div>
  <span class="pill" id="p-sys">connecting</span>
  <span class="pill" id="p-run">no run</span>
  <a class="ghost" href="/live">Pipeline</a>
  <a class="ghost" id="dl-att" href="#" hidden>Attestation</a>
  <a class="ghost" id="dl-cbom" href="#" hidden>CBOM</a>
  <label class="fresh" title="Forget what earlier runs ruled out, so every cause is tested again (your approvals are kept)"><input type="checkbox" id="fresh"> fresh memory</label>
  <button class="btn" id="go">Run analysis</button>
</header>

<div class="hud" id="left">
  <div class="stats">
    <button class="stat late" data-f="late"><b id="c-late">–</b><span>late</span></button>
    <button class="stat risk" data-f="risk"><b id="c-risk">–</b><span>at risk</span></button>
    <button class="stat retire" data-f="retire"><b id="c-retire">–</b><span>retire</span></button>
    <button class="stat safe" data-f="safe"><b id="c-safe">–</b><span>safe</span></button>
  </div>
  <div id="speed"></div>
  <div class="legend">
    <div class="lg"><i style="--c:var(--agent)">◆</i>Agents</div>
    <div class="lg"><i style="--c:var(--core)">⬡</i>Zetaris gateway</div>
    <div class="lg"><i style="--c:var(--infra)">▤</i>Data sources</div>
    <div class="lg"><i style="--c:var(--core)">◈</i>Notary vault</div>
    <div class="lg"><i style="--c:var(--text)">●</i>Your assets</div>
    <div class="lg"><i style="--c:var(--risk)">┃</i>Needs a decision</div>
  </div>
  <div class="rule">late when <code>x + y &gt; z − now</code></div>
  <div class="rule links"><a href="/ui/grid">grid view</a> · <a href="/report">full report</a></div>
</div>

<div class="hud" id="right">
  <div class="hd"><span class="k">Decisions</span><b id="nq">0</b></div>
  <div id="queue"></div>
</div>

<div class="help">drag · scroll · click a crystal</div>
<div class="hud" id="feed"></div>
<div class="hud" id="tip"></div>
<aside id="drawer" aria-hidden="true"></aside>
<div class="toasts" id="toasts"></div>
<div id="nogl"><div>WebGL is not available in this browser.<br><br><a class="ghost" href="/ui/grid">Open the grid view</a></div></div>

  try {
    if ($('#fresh').checked) { const m = await fetch('/memory', { method:'DELETE' }); if (!m.ok) throw new Error('memory reset refused (' + m.status + ')'); feed('in', 'memory cleared: every cause will be tested again'); }
    const r = await (await fetch('/ask/start', { method:'POST', headers:{ 'content-type':'application/json' }, body:'{}' })).json(); LIVE = r.run_id; }
  catch (e) { busy(false); toast('Could not start a run: ' + e.message); }
};

(async function boot() {
  const m = await (await fetch('/meta')).json();
  const on = m.model && m.model.online;
  $('#p-sys').textContent = `${m.data_backend} · ${on ? 'nemotron' : 'model offline'}`; $('#p-sys').className = 'pill ' + (m.data_backend === 'zetaris' && on ? 'on' : '');
  const c = ((m.extra || {}).cards || [])[0]; const am = c && /Anchors: (.*)/.exec(c.note || ''); if (am) am[1].split(', ').forEach(kv => { const [k, val] = kv.split('='); if (+val) Z[k] = +val; });
  await load(); listen();
})();
</script>
