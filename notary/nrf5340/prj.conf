# Protocol transport: UART0 = J-Link virtual COM port on the nRF5340 DK, 115200 8N1.
# RX is interrupt driven into a ring buffer (polling drops bytes on long SIGN lines).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Nothing unsolicited may appear on the protocol UART.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# Key storage: one settings entry (pk || sk, 3872 bytes) in NVS.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# randombytes() -> sys_csrand_get() -> zephyr,entropy (CryptoCell-312 on nRF5340 cpuapp).
CONFIG_ENTROPY_GENERATOR=y

# pqm4 ML-DSA-44, Cortex-M4F implementation (runs unchanged on the Cortex-M33F app core).
CONFIG_PQM4_MLDSA44=y
CONFIG_PQM4_MLDSA44_M4F=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
# m4f needs ~45 KB of stack for signing (pqm4 benchmarks); 56 KB leaves headroom for
# Zephyr, the FPU context and the command handler. Measured high-water mark: TIME stack_unused.
CONFIG_MAIN_STACK_SIZE=57344
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
